<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Alm Sans Arabic";src:url(../../fonts/AlmSansArabic-Regular.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Alm Sans Arabic";src:url(../../fonts/AlmSansArabic-Bold.woff2) format("woff2");font-weight:500 900}
html,body{margin:0;background:#FFFFFF;overflow:hidden}
svg{display:block;width:1200px;height:900px}

<svg id="S" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="engine.js"></script>
<script src="scenes.js"></script>
<script>
Promise.all(['400','700'].map(w=>document.fonts.load(w+' 40px "Alm Sans Arabic"','أبجد 0123'))).then(()=>{
  const k=new URLSearchParams(location.search).get('s');
  bg(); R=G(S,{id:'R'}); SCENES[k](); theme(R); render(0); window.READY=true;
}).catch(e=>{window.ERR=String(e)});
</script>
