<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-0bCW/ZbVtUVmcOFhtpDk4L6ijyOiz/b6btWM5zIQOKY='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' wss://relay.damus.io wss://nos.lol wss://relay.primal.net wss://offchain.pub wss://nostr.mom https://ntfy.sh; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0D1F" media="(prefers-color-scheme: dark)">
<title>التحكم بالعرض · دليل المعلم الألمعي</title>
<link rel="icon" type="image/png" sizes="32x32" href="../m2/fav-32.png">
<link rel="apple-touch-icon" href="../m2/touch-180.png">
<script>try{var t=JSON.parse(localStorage.getItem('dms:theme')||'null');document.documentElement.setAttribute('data-theme',t==='dark'||t==='light'?t:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}</script>
<style>
@font-face{font-family:"Alm Sans Arabic";src:url("../fonts/AlmSansArabic-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Alm Sans Arabic";src:url("../fonts/AlmSansArabic-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Alm Sans Arabic";src:url("../fonts/m2d-alm-400.woff2") format("woff2");font-weight:400;unicode-range:U+0660-066C,U+06F0-06F9;font-display:block}
@font-face{font-family:"Alm Sans Arabic";src:url("../fonts/m2d-alm-700.woff2") format("woff2");font-weight:700;unicode-range:U+0660-066C,U+06F0-06F9;font-display:block}
@font-face{font-family:"Hafs";src:url("../fonts/hafs.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Sym";src:url("../fonts/amiri-sym.woff2") format("woff2");unicode-range:U+FDFA,U+FD3E-FD3F}
:root{--bg:#FFFFFF;--sunk:#F7F6FB;--card:#FFFFFF;--ink:#1E1B4B;--ink2:#5B5880;--ink3:#6E6B8F;--line:#E7E5F2;--line2:#D4D1E6;
 --pri:#6D28D9;--pri-h:#5B21B6;--pri-t:#6D28D9;--pri-50:#F5F3FF;--pri-100:#EDE9FE;--pri-200:#DDD6FE;--on-pri:#FFFFFF;
 --acc:#34D399;--acc-50:#ECFDF5;--acc-ink:#047857;--warn:#B45309;--warn-50:#FFFBEB;--bad:#B42318;--bad-50:#FEF3F2;--dock:rgba(255,255,255,.92)}
html[data-theme="dark"]{--bg:#0E0D1F;--sunk:#121128;--card:#17162E;--ink:#ECEAFB;--ink2:#B4B0D6;--ink3:#9894C0;--line:#2A2848;--line2:#3A3762;
 --pri:#7C3AED;--pri-h:#6D28D9;--pri-t:#A78BFA;--pri-50:#1E1A3F;--pri-100:#2A2357;--pri-200:#3B3176;--on-pri:#FFFFFF;
 --acc-50:#0F2A23;--acc-ink:#6EE7B7;--warn:#FBBF24;--warn-50:#2B2210;--bad:#FDA29B;--bad-50:#2E1416;--dock:rgba(14,13,31,.9)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Alm Sans Arabic",Tahoma,sans-serif;font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--pri-t);outline-offset:2px}
.app{min-height:100vh;min-height:100dvh;max-width:560px;margin:0 auto;padding:0 16px calc(118px + env(safe-area-inset-bottom))}
.app[data-v="msg"]{padding-bottom:24px}
/* الشريط */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--dock);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{flex:none;width:34px;height:34px;border-radius:9px}
.brand span{display:grid;min-width:0;line-height:1.35}
.brand b{font-size:16px}
.brand small{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.net{flex:none;display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink2);background:var(--card)}
.net i{width:9px;height:9px;border-radius:50%;background:#F59E0B}
.net[data-k="wait"] i{animation:pulse 1.4s ease-in-out infinite}
.net[data-k="on"]{color:var(--acc-ink);border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.net[data-k="on"] i{background:#10B981}
.net[data-k="bad"]{color:var(--bad)}
.net[data-k="bad"] i{background:#EF4444}
@keyframes pulse{50%{opacity:.3}}
/* الرسائل */
.msg{display:grid;justify-items:center;text-align:center;gap:6px;padding:56px 8px 24px}
.msg-ic{display:grid;place-items:center;width:76px;height:76px;border-radius:24px;background:var(--pri-50);color:var(--pri-t);margin-bottom:8px}
.msg-ic svg{width:36px;height:36px}
.msg[data-k="bad"] .msg-ic{background:var(--bad-50);color:var(--bad)}
.msg[data-k="wait"] .msg-ic svg{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.msg h1{margin:0;font-size:22px;line-height:1.5}
.msg p{margin:0;max-width:34em;color:var(--ink2)}
.msg-acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);font-weight:700;font-size:16px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
/* الشاشة الحالية */
.live{display:grid;gap:12px;padding-top:14px}
.now{border:1px solid var(--line);border-radius:20px;padding:16px 16px 14px;background:var(--card);transition:opacity .15s}
.now.pend{opacity:.55}
.now-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.kind{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;background:var(--pri-50);color:var(--pri-t);font-size:13.5px;font-weight:700}
.count{font-size:14px;font-weight:700;color:var(--ink2);direction:ltr;unicode-bidi:isolate}
.now h1{margin:2px 0 4px;font-size:22px;line-height:1.5}
.stage{margin:0 0 6px;font-size:13.5px;color:var(--ink3)}
.txt{position:relative;color:var(--ink);font-size:16.5px;line-height:1.95;overflow:hidden}
.txt.clip{max-height:9.8em}
.txt.clip::after{content:"";position:absolute;inset:auto 0 0;height:3.2em;background:linear-gradient(to bottom,transparent,var(--card))}
.q{font-family:"Hafs","Sym",serif;font-size:1.22em;line-height:2.05;font-weight:400}
.more{border:0;background:none;color:var(--pri-t);font-weight:700;padding:6px 0 0;font-size:15px}
.skill{display:inline-block;margin-top:8px;font-size:13px;color:var(--acc-ink);background:var(--acc-50);border-radius:999px;padding:2px 10px}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.keys span{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink3)}
.keys span.on{color:var(--acc-ink);background:var(--acc-50);border-color:transparent}
.keys svg{width:14px;height:14px}
/* لوحة التفاعل */
.it{border:1px solid var(--line);border-radius:20px;padding:14px;background:var(--card)}
.it:empty{display:none}
.it-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.it-h b{font-size:16px}
.it-h small{color:var(--ink3);font-size:13px}
.parts{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.parts li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--sunk);font-size:15.5px;line-height:1.8}
.parts li i{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--card);border:1px solid var(--line2);font-style:normal;font-size:13px;font-weight:700;color:var(--ink2);margin-top:2px}
.parts li.done{background:var(--acc-50);border-color:transparent}
.parts li.done i{background:#10B981;border-color:#10B981;color:#FFFFFF}
.parts li.next{border-color:var(--pri-200);background:var(--pri-50)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.priv{margin:10px 0 0;font-size:12.5px;color:var(--ink3);display:flex;gap:6px;align-items:center}
.priv svg{width:15px;height:15px;flex:none}
.votes{display:grid;gap:8px}
.vo{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(to left,var(--pri-50) var(--p,0%),var(--sunk) var(--p,0%))}
.vo.lead{border-color:var(--pri-200)}
.vo i{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--card);border:1px solid var(--line2);font-style:normal;font-weight:700;font-size:14px}
.vo span{flex:1;min-width:0;font-size:15px;line-height:1.6}
.vo b{min-width:2ch;text-align:center;font-size:18px}
.vo button{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-size:22px;font-weight:700;line-height:1}
.vo button.plus{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.vo button:disabled{opacity:.35}
.steps{display:grid;gap:8px}
.st{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--sunk);font-size:15.5px;line-height:1.7;min-height:52px}
.st i{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:9px;border:1.5px solid var(--line2);background:var(--card);font-style:normal;font-weight:700;font-size:13px;color:var(--ink2)}
.st.done{background:var(--acc-50);border-color:transparent}
.st.done i{background:#10B981;border-color:#10B981;color:#FFFFFF}
.st.done span{color:var(--ink2)}
.keyb{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px;border-radius:16px;border:1.5px dashed var(--pri-200);background:var(--pri-50)}
.keyb svg{width:26px;height:26px;color:var(--pri-t);flex:none}
.keyb span{display:grid;line-height:1.5}
.keyb small{color:var(--ink2);font-size:13px}
.keyb b{font-size:17px}
.keyb.got{border-style:solid;border-color:transparent;background:var(--acc-50)}
.keyb.got svg{color:var(--acc-ink)}
.ring{display:flex;align-items:center;gap:12px}
.ring b{font-size:26px;direction:ltr;unicode-bidi:isolate;min-width:3.2em}
.ring .btn{flex:1}
.ring + .parts,.ring + .it-h{margin-top:12px}
/* الأدوات */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.timer{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.timer .tb{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:14px;border:0;background:var(--pri);color:var(--on-pri)}
.timer .tb svg{width:24px;height:24px}
.timer.run .tb{background:var(--acc-50);color:var(--acc-ink);border:1.5px solid color-mix(in srgb,var(--acc) 50%,transparent)}
.timer > span{flex:1;display:grid;line-height:1.3;min-width:0}
.timer b{font-size:26px;direction:ltr;unicode-bidi:isolate;text-align:start}
.timer.over b{color:var(--bad)}
.timer small{font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink2)}
.ib svg{width:22px;height:22px}
.chip{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:15.5px}
.chip svg{width:21px;height:21px;color:var(--pri-t)}
.pick{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--pri-50);border:1px solid var(--pri-200)}
.pick span{flex:1;display:grid;line-height:1.4}
.pick small{color:var(--ink2);font-size:13px}
.pick b{font-size:20px}
.pick .btn{min-height:42px;padding:0 16px}
/* درج المعلم */
.notes{border:1px solid var(--line);border-radius:20px;background:var(--card);overflow:hidden}
.notes summary{display:flex;align-items:center;gap:8px;padding:14px 16px;font-weight:700;cursor:pointer;list-style:none;min-height:52px}
.notes summary::-webkit-details-marker{display:none}
.notes summary svg{width:20px;height:20px;color:var(--pri-t)}
.notes summary::after{content:"";margin-inline-start:auto;width:9px;height:9px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.notes[open] summary::after{transform:translateY(2px) rotate(-135deg)}
.nb{padding:0 16px 14px;display:grid;gap:10px}
.nr{border-top:1px solid var(--line);padding-top:10px}
.nr b{display:block;font-size:13.5px;color:var(--pri-t);margin-bottom:2px}
.nr p{margin:0;font-size:15px;line-height:1.85}
.nr.my p{background:var(--warn-50);border-radius:12px;padding:8px 10px}
.nr.hd b{color:var(--ink);font-size:15px}
.nr.hd p{color:var(--ink3);font-size:13.5px}
/* أزرار التنقل */
.dock{position:fixed;inset:auto 0 0;z-index:6;display:flex;gap:10px;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--dock);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.dock > *{max-width:264px}
.nav{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-height:66px;border-radius:20px;border:1.5px solid var(--line2);background:var(--card);font-weight:700;font-size:18px;line-height:1.25;padding:0 12px}
.nav span{display:grid;text-align:center;min-width:0}
.nav small{font-size:12px;font-weight:400;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:11em}
.nav svg{width:26px;height:26px;flex:none}
.nav.next{flex:1.45;background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.nav.next small{color:#EDE9FE}
.nav:active:not(:disabled){transform:scale(.98)}
.nav:disabled{opacity:.4}
/* قائمة الشاشات */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,18,58,.45)}
.sheet[hidden]{display:none}
.sheet-in{width:100%;max-width:560px;max-height:82vh;max-height:82dvh;display:flex;flex-direction:column;background:var(--card);border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header b{font-size:17px}
.sheet ol{list-style:none;margin:0;padding:8px;overflow:auto;display:grid;gap:4px}
.sheet li button{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:10px 12px;border-radius:14px;border:1px solid transparent;background:none;min-height:56px}
.sheet li button i{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sunk);font-style:normal;font-weight:700;font-size:13px;color:var(--ink2)}
.sheet li button span{display:grid;line-height:1.45;min-width:0}
.sheet li button small{font-size:12.5px;color:var(--pri-t);font-weight:700}
.sheet li button b{font-size:15px;font-weight:400}
.sheet li button.cur{background:var(--pri-50);border-color:var(--pri-200)}
.sheet li button.cur i{background:var(--pri);color:var(--on-pri)}
.toast{position:fixed;inset-inline:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:30;max-width:520px;margin:0 auto;padding:12px 16px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:15px;text-align:center;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@supports not (color-mix(in srgb,red,blue)){.net[data-k="on"]{border-color:var(--line)}.timer.run .tb{border-color:var(--acc)}}
</style>
</head>
<body>
<div class="app" id="app" data-v="msg">
  <header class="top">
    <span class="brand"><img src="../m2/logo.svg" alt="" width="34" height="34"><span><b>التحكم بالعرض</b><small id="lsn">دليل المعلم الألمعي</small></span></span>
    <span class="net" id="net" data-k="wait" role="status"><i></i><span id="netT">يتصل…</span></span>
  </header>

  <section class="msg" id="msg" data-k="wait">
    <div class="msg-ic" id="msgIc" aria-hidden="true"></div>
    <h1 id="msgT">يتصل بشاشة العرض…</h1>
    <p id="msgP">لحظات، ويظهر هنا ما على الشاشة.</p>
    <div class="msg-acts" id="msgA"></div>
  </section>

  <main class="live" id="live" hidden>
    <article class="now" id="now">
      <div class="now-meta"><span class="kind" id="kind"></span><span class="count" id="count" aria-live="polite"></span></div>
      <h1 id="title"></h1>
      <p class="stage" id="stage" hidden></p>
      <div class="txt" id="txt"></div>
      <button type="button" class="more" id="more" data-a="more" hidden>اقرأ النص كاملًا</button>
      <span class="skill" id="skill" hidden></span>
    </article>
    <p class="keys" id="keys" hidden></p>
    <section class="it" id="it" aria-label="تفاعل الشاشة"></section>
    <div class="pick" id="pick" hidden role="status"></div>
    <section class="tools" aria-label="أدوات الحصة">
      <div class="timer" id="timer" hidden>
        <button type="button" class="tb" data-a="tmr" id="tmb" aria-label="شغّل مؤقت المرحلة"></button>
        <span><b id="tmv">0:00</b><small id="tmn">مؤقت المرحلة</small></span>
        <button type="button" class="ib" data-a="treset" aria-label="أعد مؤقت المرحلة"></button>
      </div>
      <button type="button" class="chip" data-a="pick" id="pkb"></button>
      <button type="button" class="chip" data-a="list" id="lsb"></button>
    </section>
    <details class="notes" id="notes" hidden><summary id="notesS"></summary><div class="nb" id="nb"></div></details>
  </main>

  <nav class="dock" id="dock" hidden aria-label="التنقل بين الشاشات">
    <button type="button" class="nav prev" data-a="prev" id="prev"></button>
    <button type="button" class="nav next" data-a="next" id="next"></button>
  </nav>

  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetT">
    <div class="sheet-in"><header><b id="sheetT">شاشات العرض</b><button type="button" class="ib" data-a="sheetx" aria-label="أغلق" id="sheetX"></button></header><ol id="deck"></ol></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script type="module" src="remote.js"></script>
</body>
</html>
