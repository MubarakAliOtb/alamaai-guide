<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الصفحة غير موجودة — دليل المعلم الألمعي</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/alamaai-guide/emblem.png">
<style>
:root{--bg:#EEF4FF;--surface:#fff;--ink:#0D1B3D;--ink2:#4A5878;--line:#D5E0F2;--brand:#2563EB;--on-brand:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0A1530;--surface:#16264D;--ink:#F1F5FF;--ink2:#AEBBD6;--line:#334A7A;--brand:#8DB0F7;--on-brand:#0D1B3D;color-scheme:dark}}
html,body{margin:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.8 "IBM Plex Sans Arabic",Tahoma,sans-serif;padding:24px 16px;box-sizing:border-box}
main{max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px 28px;text-align:center}
img{width:72px;height:72px;border-radius:18px}
h1{margin:16px 0 6px;font-size:24px;line-height:1.5;text-wrap:balance}
p{margin:0 0 20px;color:var(--ink2)}
a{display:inline-block;background:var(--brand);color:var(--on-brand);text-decoration:none;font-weight:700;padding:11px 26px;border-radius:999px}
a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body dir="rtl">
<main>
  <img src="/alamaai-guide/emblem.png" alt="">
  <h1>هذه الصفحة غير موجودة</h1>
  <p>قد يكون الرابط ناقصًا أو قديمًا. كل أقسام «دليل المعلم الألمعي» تُفتح من صفحته الرئيسية.</p>
  <a href="/alamaai-guide/">افتح الدليل</a>
</main>
</body>
</html>
