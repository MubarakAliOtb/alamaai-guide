<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="color-scheme" content="light dark">
<title>متعة صفية · دليل المعلم الألمعي</title>
<meta name="description" content="ألعاب جماعية وذهنية وألغاز وأفكار لمتعة الحصة ونماذج للطباعة، ضمن دليل المعلم الألمعي. إعداد وتطوير: أ. عمر خالد العتيبي.">
<meta name="author" content="أ. عمر خالد العتيبي">
<link rel="icon" type="image/svg+xml" href="../m2/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../m2/fav-32.png">
<link rel="apple-touch-icon" href="../m2/touch-180.png">
<script>try{var t=JSON.parse(localStorage.getItem('dms:theme')||'null');document.documentElement.setAttribute('data-theme',t==='dark'||t==='light'?t:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
<!--
  «متعة صفية»: ألعاب جماعية وذهنية وألغاز وأفكار لمتعة الحصة ونماذج للطباعة.
  إعداد وتطوير: أ. عمر خالد العتيبي. أُدرجت في «دليل المعلم الألمعي» بنظام تصميمه (الخط والألوان والوضع الليلي)، ومحتواها وألعابها كما أعدّها.
  مصادر الإلهام مذكورة في كل قسم. ما يحفظه المعلم هنا (المفضلة والنتائج والألغاز المحلولة) يبقى في متصفحه بالبادئة mtaa_.
-->
<style>
@font-face{font-family:"Alm Sans Arabic";src:url("../fonts/AlmSansArabic-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Alm Sans Arabic";src:url("../fonts/AlmSansArabic-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Alm Sans Arabic";src:url("../fonts/m2d-alm-400.woff2") format("woff2");font-weight:400;unicode-range:U+0660-066C,U+06F0-06F9;font-display:block}
@font-face{font-family:"Alm Sans Arabic";src:url("../fonts/m2d-alm-700.woff2") format("woff2");font-weight:700;unicode-range:U+0660-066C,U+06F0-06F9;font-display:block}

/* Layout: white paper with sunny yellow accents (dark: charcoal with yellow). Sticky top bar, page hero with drawn doodles, filterable card grids. */
/* نظام تصميم «دليل المعلم الألمعي»: أبيض وخطوط رفيعة بلا ظلال، وخط Alm Sans Arabic، والنيلي للنص والبنفسجي للإجراء والنعناعي لإبراز واحد */
:root{
  --bg:#FFFFFF; --paper:#FFFFFF; --ink:#1E1B4B; --muted:#5B5880; --ink3:#6E6B8F; --line:#E7E5F2; --line2:#D4D1E6; --soft:#F7F6FB;
  --pri:#6D28D9; --pri-h:#5B21B6; --pri-t:#6D28D9; --pri-50:#F5F3FF; --pri-100:#EDE9FE; --pri-200:#DDD6FE; --on-pri:#FFFFFF;
  --acc:#34D399; --acc-50:#ECFDF5; --acc-ink:#047857;
  --c1:var(--pri-t); --c2:var(--pri-t); --c3:var(--acc-ink); --c4:var(--pri-t); --c5:var(--pri-t);
  --t1:var(--pri-50); --t2:var(--pri-50); --t3:var(--acc-50); --t4:var(--pri-50); --t5:var(--pri-50);
  --on-accent:#FFFFFF; --grid:transparent; --chalk:var(--ink); --shadow:none;
  --font-d:"Alm Sans Arabic",Tahoma,sans-serif; --font-b:"Alm Sans Arabic",Tahoma,sans-serif; --r:16px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0E0D1F; --paper:#17162E; --ink:#ECEAFB; --muted:#B4B0D6; --ink3:#9894C0; --line:#2A2848; --line2:#3A3762; --soft:#121128;
  --pri:#7C3AED; --pri-h:#6D28D9; --pri-t:#A78BFA; --pri-50:#1E1A3F; --pri-100:#2A2357; --pri-200:#3B3176;
  --acc-50:#0F2A23; --acc-ink:#6EE7B7;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-b); font-size:16px; line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px; direction:rtl;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
#app{min-height:100vh}
a{color:var(--c4)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c4);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:700;line-height:1.35;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* ===== top bar ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-bottom:3px solid var(--c2)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex-shrink:0}
.brand svg{width:40px;height:40px}
.brand b{font-family:var(--font-d);font-size:18px;line-height:1.1;display:block}
.brand small{display:block;color:var(--muted);font-size:12px}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding-block:2px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex-shrink:0;text-decoration:none;color:var(--muted);padding:7px 12px;border-radius:999px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a.on{background:var(--c2);color:var(--on-accent)}
.nav a i{width:8px;height:8px;border-radius:50%;display:inline-block}
.theme-btn{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;display:grid;place-items:center}
.theme-btn svg{width:22px;height:22px}
.theme-btn .moon{display:none}
:root[data-theme="dark"] .theme-btn .sun{display:none}
:root[data-theme="dark"] .theme-btn .moon{display:block}
@media (max-width:820px){
  .top .wrap{flex-wrap:wrap;gap:8px}
  .nav{order:3;flex-basis:100%}
  .brand{flex:1}
}

/* ===== hero ===== */
.hero{padding-block:44px 26px}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--muted);background:var(--paper);border:1px solid var(--line);padding:5px 12px;border-radius:999px}
.hero h1{font-size:clamp(34px,5.6vw,62px);margin-top:14px;letter-spacing:-.01em}
.hero h1 .hl{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--c2) 55%,transparent) 62%);padding-inline:4px}
.author{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.author .by{font-size:14px;color:var(--muted)}
.author .name{font-family:var(--font-d);font-size:22px;color:var(--c1);border-bottom:2px dashed transparent;outline:none;min-width:40px}
.author .name[contenteditable="true"]{border-bottom-color:var(--c1)}
.author button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.hero .lead{margin-top:14px;color:var(--muted);font-size:17px;max-width:58ch}
.hero-art svg{width:100%;height:auto;max-width:460px;display:block;margin-inline:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600}
.chip b{font-family:var(--font-d);font-size:16px}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}.hero-art{order:-1}.hero-art svg{max-width:330px}.hero{padding-block:24px 16px}}

/* ===== sections ===== */
.sec{padding-block:26px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.sec-h h2{font-size:clamp(24px,3.2vw,32px)}
.sec-h p{color:var(--muted);max-width:62ch}
.sec-h .count{font-family:var(--font-d);color:var(--c3);font-size:15px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.search{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:44px}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;height:100%}
.search svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.pill:hover{color:var(--ink)}
.pill.on{background:var(--c2);border-color:var(--c2);color:var(--on-accent)}
.pill .n{font-size:11px;opacity:.7}

.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:var(--c4);color:var(--on-accent);font-size:14.5px;text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.warm{background:var(--c1)}
.btn.sun{background:var(--c2);color:var(--on-accent)}
.btn.teal{background:var(--c3)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* grids */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.grid.tight{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow);transition:transform .18s ease}
.card:hover{transform:translateY(-2px)}
.card .art{display:block;width:100%;aspect-ratio:16/7;max-width:100%}
.card .art svg{width:100%;height:100%;display:block}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.card h3{font-size:18px}
.card .desc{color:var(--muted);font-size:14.5px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px;align-items:center}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted)}
.tag.k1{background:var(--t1);color:color-mix(in srgb,var(--c1) 55%,var(--ink))}.tag.k2{background:var(--t2);color:color-mix(in srgb,var(--c2) 45%,var(--ink))}.tag.k3{background:var(--t3);color:color-mix(in srgb,var(--c3) 50%,var(--ink))}.tag.k4{background:var(--t4);color:color-mix(in srgb,var(--c4) 45%,var(--ink))}.tag.k5{background:var(--t5);color:color-mix(in srgb,var(--c5) 50%,var(--ink))}
.idx{font-family:var(--font-d);font-size:13px;color:var(--muted)}
.fav{margin-inline-start:auto;border:0;background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;padding:4px 6px;border-radius:8px}
.fav svg{width:20px;height:20px}
.fav.on{color:var(--c5)}
.fav.on svg path{fill:var(--c5)}
.heat{display:inline-flex;gap:2px}
.heat span{width:7px;height:14px;border-radius:3px;background:var(--line)}
.heat span.f{background:var(--c1)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:var(--r)}

/* feature cards on home */
.feature{position:relative;text-decoration:none;color:var(--ink)}
.feature .art{aspect-ratio:16/8}
.feature .go{color:var(--c4);font-weight:700;font-size:14px}

/* compact idea cards */
.idea{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;min-width:0}
.idea .ic{width:46px;height:46px;flex-shrink:0;border-radius:12px;display:grid;place-items:center}
.idea .ic svg{width:30px;height:30px}
.idea .tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.idea h3{font-size:16px}
.idea p{color:var(--muted);font-size:14px}
.idea .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}

/* panels */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}
.panel h3{font-size:20px;margin-bottom:6px}
.panel .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.two,.three{grid-template-columns:1fr}}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;min-width:0;width:100%}
.field textarea{min-height:84px;resize:vertical}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

/* banner strip between sections */
.strip{border-radius:20px;padding:22px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--t4);border:1px solid var(--line)}
.strip svg.sart{width:92px;height:92px}
.strip h3{font-size:22px}
.strip p{color:var(--muted)}
@media (max-width:700px){.strip{grid-template-columns:1fr;text-align:center}.strip svg.sart{margin-inline:auto}}

/* tool area: timer, scoreboard, picker */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:980px){.tools{grid-template-columns:1fr}}
.timer-face{font-family:var(--font-d);font-size:56px;text-align:center;line-height:1.1;padding:8px 0}
.timer-face.low{color:#D9480F}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.team{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--bg);margin-bottom:6px}
.team input{flex:1;min-width:0;border:0;background:transparent;font-weight:700;outline:none}
.team .sc{font-family:var(--font-d);font-size:22px;min-width:44px;text-align:center}
.team button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:800}
.picked{min-height:120px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;padding:10px;border-radius:14px;background:var(--bg)}
.picked b{font-family:var(--font-d);font-size:22px}
.picked span{color:var(--muted);font-size:14px}

/* decks */
.deck-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.deck-card{min-height:220px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px;position:relative;overflow:hidden;border:1px solid var(--line)}
.deck-card .big{font-family:var(--font-d);font-size:clamp(22px,3.4vw,34px);line-height:1.4}
.deck-card .or{font-family:var(--font-d);color:var(--muted)}
.deck-card .forb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.deck-card .forb span{background:var(--paper);padding:4px 10px;border-radius:999px;font-weight:700;color:var(--c1);text-decoration:line-through}
.deck-card .cnt{position:absolute;top:12px;inset-inline-start:14px;font-size:12px;color:var(--muted)}

/* riddles */
.riddle{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative;overflow:hidden}
.riddle .q{font-family:var(--font-d);font-size:18px;line-height:1.6}
.riddle .q.emoji{font-size:22px;letter-spacing:.02em}
.riddle .top-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.riddle .ans{background:var(--t3);color:var(--ink);border-radius:12px;padding:10px 12px;font-weight:600}
.riddle .hint{background:var(--t2);border-radius:12px;padding:8px 12px;font-size:14px}
.riddle .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.riddle .no{position:absolute;top:10px;inset-inline-end:14px;font-family:var(--font-d);font-size:40px;color:var(--soft);line-height:1;pointer-events:none}

/* overlay */
.overlay{position:fixed;inset:0;z-index:100;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--paper);border:1px solid var(--line);border-radius:22px;width:min(760px,100%);max-height:100%;overflow:auto;box-shadow:0 30px 80px -30px rgba(0,0,0,.5);display:flex;flex-direction:column}
.modal.big{width:min(1000px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2;flex-wrap:wrap}
.modal-h h3{font-size:19px;flex:1;min-width:0}
.modal-b{padding:18px}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:20px;line-height:1}
.stat{font-family:var(--font-d);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:15px}
.show-q{font-family:var(--font-d);font-size:clamp(26px,4.4vw,46px);text-align:center;line-height:1.55;padding:20px 6px}
.show-a{font-size:clamp(20px,3vw,30px);text-align:center;color:var(--c3);font-family:var(--font-d)}

/* ===== brain games ===== */
.gcard{cursor:pointer;text-align:start;border:1px solid var(--line);font:inherit;color:inherit;padding:0}
.gcard .best{font-size:12.5px;color:var(--muted)}
.gcard .play{font-weight:800;color:var(--c4);font-size:14px}
.daily{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:stretch}
@media (max-width:900px){.daily{grid-template-columns:1fr}}
.daily-list{display:flex;flex-direction:column;gap:8px}
.dl-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--bg);cursor:pointer;border:1px solid transparent;text-align:start;width:100%}
.dl-item:hover{border-color:var(--line)}
.dl-item .ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;font-weight:900;color:var(--paper)}
.dl-item.done .ck{background:var(--c3);border-color:var(--c3)}
.dl-item b{display:block}
.dl-item span{font-size:13px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:90px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.bar{height:12px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
.streak{font-family:var(--font-d);font-size:44px;line-height:1}

.gstage{display:flex;flex-direction:column;align-items:center;gap:16px;min-height:340px;justify-content:center;user-select:none;-webkit-user-select:none}
.ginfo{text-align:center;color:var(--muted);max-width:52ch}
.gover{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.gover .score{font-family:var(--font-d);font-size:60px;line-height:1.1;color:var(--c4)}
.mem-grid{display:grid;gap:8px;width:min(460px,100%)}
.mem-c{aspect-ratio:1;border-radius:14px;border:0;cursor:pointer;font-size:clamp(26px,6vw,40px);background:var(--c4);color:transparent;transition:transform .25s, background .25s;display:grid;place-items:center;max-width:100%}
.mem-c.open,.mem-c.done{background:var(--soft);color:inherit;transform:rotateY(180deg)}
.mem-c.open span,.mem-c.done span{transform:rotateY(180deg)}
.mem-c.done{opacity:.55}
.big-word{font-family:var(--font-d);font-size:clamp(44px,9vw,76px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:min(420px,100%)}
.opt{padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-weight:800;font-size:18px}
.opt:hover{border-color:var(--c4)}
.flash-ok{animation:ok .35s}
.flash-bad{animation:bad .35s}
@keyframes ok{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c3) 60%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
@keyframes bad{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.math-q{font-family:var(--font-d);font-size:clamp(40px,8vw,64px);direction:ltr}
.math-in{font-family:var(--font-d);font-size:34px;min-width:160px;text-align:center;border-bottom:3px solid var(--c4);min-height:52px;direction:ltr}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(300px,100%);direction:ltr}
.pad button{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:800;cursor:pointer}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(320px,80vw)}
.simon button{aspect-ratio:1;border-radius:24px;border:0;cursor:pointer;opacity:.45;transition:opacity .12s,transform .12s;max-width:100%}
.simon button.lit{opacity:1;transform:scale(1.04)}
.sch{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(380px,100%)}
.sch button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-family:var(--font-d);font-size:clamp(18px,4vw,26px);cursor:pointer;max-width:100%}
.sch button.hit{background:var(--t3);color:var(--muted)}
.react-box{width:min(460px,100%);aspect-ratio:16/10;border-radius:22px;display:grid;place-items:center;cursor:pointer;font-family:var(--font-d);font-size:26px;text-align:center;padding:16px;max-width:100%}
.odd-grid{display:grid;gap:6px;width:min(400px,100%)}
.odd-grid button{aspect-ratio:1;border-radius:10px;border:0;cursor:pointer;max-width:100%}
.mx-grid{display:grid;gap:6px;width:min(400px,100%)}
.mx-grid button{aspect-ratio:1;border-radius:10px;border:0;background:var(--soft);cursor:pointer;transition:background .15s;max-width:100%}
.mx-grid button.lit{background:var(--c3)}
.mx-grid button.bad{background:var(--c1)}
.shape-box{width:160px;height:160px;display:grid;place-items:center;border-radius:24px;background:var(--bg)}
.shape-box svg{width:110px;height:110px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:56px;height:56px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-family:var(--font-d);font-size:28px;cursor:pointer}
.tile:disabled{opacity:.25}
.answer-line{font-family:var(--font-d);font-size:40px;min-height:60px;border-bottom:3px dashed var(--line);min-width:200px;text-align:center}
.slide{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(300px,100%);direction:ltr}
.slide button{aspect-ratio:1;border-radius:14px;border:0;background:var(--c4);color:var(--on-accent);font-family:var(--font-d);font-size:34px;cursor:pointer;max-width:100%}
.slide button.e{background:transparent;cursor:default}
.sudo{display:grid;grid-template-columns:repeat(4,1fr);width:min(320px,100%);border:3px solid var(--ink);border-radius:12px;overflow:hidden;direction:ltr}
.sudo button{aspect-ratio:1;border:1px solid var(--line);background:var(--paper);font-family:var(--font-d);font-size:30px;cursor:pointer;max-width:100%}
.sudo button.g{background:var(--soft);cursor:default}
.sudo button.sel{background:var(--t4)}
.sudo button.err{color:var(--c1)}
.sudo button:nth-child(4n+2){border-right:3px solid var(--ink)}
.sudo button:nth-child(n+5):nth-child(-n+8){border-bottom:3px solid var(--ink)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(480px,100%)}
.cmp button{padding:26px 10px;border-radius:18px;border:2px solid var(--line);background:var(--paper);font-family:var(--font-d);font-size:clamp(26px,6vw,38px);cursor:pointer;direction:ltr}
.cmp button:hover{border-color:var(--c4)}
.dots{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(520px,100%)}
.dots button{aspect-ratio:1;border-radius:18px;border:2px solid var(--line);background:var(--bg);cursor:pointer;padding:0;max-width:100%}
.dots svg{width:100%;height:100%}

/* ===== printables ===== */
.pr-layout{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
@media (max-width:980px){.pr-layout{grid-template-columns:1fr}}
.pr-list{display:flex;flex-direction:column;gap:6px}
.pr-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);cursor:pointer;text-align:start;width:100%}
.pr-item.on{border-color:var(--c4);background:var(--t4)}
.pr-item .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.pr-item .ic svg{width:26px;height:26px}
.pr-item b{display:block;font-size:14.5px}
.pr-item span{font-size:12.5px;color:var(--muted)}
.sheets{display:flex;flex-direction:column;gap:18px;align-items:center;overflow-x:auto;padding-bottom:6px}
.sheet{width:794px;min-height:1123px;background:#fff;color:#1E1B4B;padding:44px 48px;box-shadow:0 18px 40px -24px rgba(0,0,0,.5);border-radius:6px;position:relative;font-family:var(--font-b);flex-shrink:0;display:flex;flex-direction:column}
.sheet-scale{width:100%;overflow-x:auto;display:flex;justify-content:center}
.sheet h2{font-family:var(--font-d);font-size:30px;text-align:center;color:#1E1B4B}
.sheet .sh-sub{text-align:center;color:#5B5880;font-size:14px;margin-top:4px}
.sheet .sh-head{display:flex;justify-content:space-between;gap:16px;font-size:14px;margin:14px 0 18px;color:#1E1B4B}
.sheet .sh-head span{flex:1;border-bottom:1.5px dotted #99a;padding-bottom:4px}
.sheet .foot{margin-top:auto;padding-top:14px;font-size:11px;color:#6E6B8F;display:flex;justify-content:space-between}
.sheet table{border-collapse:collapse;width:100%}
.sheet td,.sheet th{border:2px solid #1E1B4B;text-align:center;vertical-align:middle}
.bingo td{height:118px;padding:8px;font-size:14.5px;font-weight:600;width:20%}
.bingo td.free{background:#F5F3FF;font-family:var(--font-d);font-size:20px}
.bingo td small{display:block;margin-top:18px;border-top:1px dotted #99a;color:#6E6B8F;font-size:10px;font-weight:400}
.ws td{width:auto;height:46px;font-family:var(--font-d);font-size:24px;border:1.5px solid #c7cede}
.ws-words{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:16px;font-size:17px;font-weight:700;justify-content:center}
.ws-words span::before{content:"☐ ";color:#6D28D9}
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1.5px dashed #9aa}
.cards-grid>div{border:1.5px dashed #9aa;min-height:228px;padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;position:relative}
.cards-grid .ct{font-family:var(--font-d);font-size:24px}
.cards-grid .cs{font-size:13px;color:#5B5880}
.cards-grid .cf{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.cards-grid .cf span{border:1.5px solid #B42318;color:#B42318;border-radius:99px;padding:1px 8px;font-size:13px;font-weight:700}
.cards-grid .ans-flip{position:absolute;bottom:8px;inset-inline:10px;font-size:11px;color:#6E6B8F;transform:rotate(180deg)}
.cards-grid .cn{position:absolute;top:8px;inset-inline-start:12px;font-size:11px;color:#6E6B8F}
.cat-tbl th{background:#F5F3FF;font-family:var(--font-d);font-size:17px;padding:8px}
.cat-tbl td{height:58px}
.xo td{height:230px;width:33.3%;font-size:17px;font-weight:600;padding:14px}
.score-tbl th{background:#F5F3FF;font-family:var(--font-d);font-size:17px;padding:8px}
.score-tbl td{height:46px}
.ticket{border:2px dashed #9aa;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.ticket h4{font-family:var(--font-d);font-size:18px}
.ticket .ln{border-bottom:1.5px dotted #99a;height:24px}
.tickets{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pr-note{background:var(--t2);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
#print-root{display:none}
@media print{
  @page{size:A4;margin:0}
  html.print-mode body{background:#fff !important;background-image:none !important}
  html.print-mode body>*:not(#print-root){display:none !important}
  html.print-mode #print-root{display:block !important}
  #print-root .sheet{box-shadow:none;border-radius:0;margin:0;page-break-after:always;break-after:page;width:210mm;min-height:297mm;padding:12mm 13mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ===== factory ===== */
.hook-list{display:flex;flex-direction:column;gap:8px;max-height:560px;overflow:auto;padding-inline-end:4px}
.hook{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid transparent}
.hook:hover{border-color:var(--line)}
.hook .t{flex:1;min-width:0;font-weight:600}
.hook .ty{font-size:11.5px;color:var(--muted);display:block;font-weight:700}
.hook button{flex-shrink:0}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--bg);border-radius:14px;padding:10px;min-width:220px;display:flex;flex-direction:column;gap:8px}
.col h4{font-size:15px;display:flex;justify-content:space-between;align-items:center;padding:4px 6px}
.icard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.icard b{font-size:14.5px}
.icard p{font-size:13px;color:var(--muted)}
.icard .acts{display:flex;gap:4px;flex-wrap:wrap}
.icard .acts button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:2px 8px;font-size:12px;cursor:pointer}
.script-out{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:14px;min-height:140px;font-size:15px;border:1px dashed var(--line)}
.week{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;overflow-x:auto}
.day{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:120px}
.day b{font-family:var(--font-d)}
.day select,.day input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 8px;font-size:13px;width:100%;min-width:0}
.roulette{font-family:var(--font-d);font-size:clamp(20px,3vw,26px);line-height:1.6;text-align:center;padding:18px;border-radius:16px;background:var(--t5);min-height:130px;display:flex;align-items:center;justify-content:center}

.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;z-index:200;font-size:14px;box-shadow:var(--shadow)}

footer{padding-block:40px;color:var(--muted);font-size:14px;text-align:center}
footer .wrap{display:flex;flex-direction:column;gap:6px;align-items:center}

.sources{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
.sources a{font-weight:700;text-decoration:none;background:var(--paper);border:1px solid var(--line);padding:3px 10px;border-radius:999px}

.float-in{animation:fin .4s ease both}
@keyframes fin{from{transform:translateY(8px)}to{transform:none}}
.wiggle{animation:wig 5s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box}
@keyframes wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;scroll-behavior:auto !important}}

/* svg fills */
.f1{fill:var(--c1)}.f2{fill:var(--c2)}.f3{fill:var(--c3)}.f4{fill:var(--c4)}.f5{fill:var(--c5)}
.ft1{fill:var(--t1)}.ft2{fill:var(--t2)}.ft3{fill:var(--t3)}.ft4{fill:var(--t4)}.ft5{fill:var(--t5)}
.fp{fill:var(--paper)}.fi{fill:var(--ink)}.fb{fill:var(--bg)}.fs{fill:var(--soft)}
.sk{stroke:var(--ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.sk2{stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.skc1{stroke:var(--c1)}.skc2{stroke:var(--c2)}.skc3{stroke:var(--c3)}.skc4{stroke:var(--c4)}.skc5{stroke:var(--c5)}


/* ===== مطابقة مكوّنات الدليل ===== */
body{background-image:none;font-size:16px;line-height:1.75}
h1,h2,h3,h4{font-weight:700;letter-spacing:0}
a{color:var(--pri-t)}
:focus-visible{outline:3px solid var(--pri-t)}
.ii{width:16px;height:16px;flex:none;vertical-align:-3px;margin-inline-end:4px}
/* الشريط العلوي كما في صفحات الدليل */
.top{background:color-mix(in srgb,var(--paper) 94%,transparent);border-bottom:1px solid var(--line)}
.top .wrap{gap:12px;padding-block:9px}
.brand img{width:40px;height:40px;border-radius:10px;flex:none}
.brand b{font-family:var(--font-b);font-size:17px;font-weight:700;line-height:1.3}
.brand small{color:var(--muted);font-size:12.5px;line-height:1.4}
.nav{gap:4px;margin-inline-start:8px;flex:1}
.nav a{color:var(--muted);font-weight:700;font-size:14.5px;padding:7px 14px;border-radius:999px;text-decoration:none;white-space:nowrap;background:transparent;border:0}
.nav a:hover{color:var(--ink);background:var(--soft)}
.nav a.on{background:var(--pri-50);color:var(--pri-t)}
.nav a i{display:none}
.theme-btn{width:42px;height:42px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.theme-btn:hover{background:var(--pri-50)}
.top .back{flex:none}
@media (max-width:820px){.top .back{min-height:40px;padding-inline:12px;font-size:13px}.top .wrap{flex-wrap:wrap}.nav{flex:1 1 100%;order:3;margin-inline-start:0;padding-bottom:2px}.brand{flex:1;min-width:0}.brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
/* زر الوضع يرسم الوضع الذي ينقل إليه، كما في الدليل: القمر في النهار والشمس في الليل */
.theme-btn .sun{display:none}.theme-btn .moon{display:block}
:root[data-theme="dark"] .theme-btn .sun{display:block}:root[data-theme="dark"] .theme-btn .moon{display:none}
@media (max-width:560px){.brand small{display:none}}
/* رأس القسم: مسار صغير، وعنوان، واسم معدّ المحتوى، وصورة حقيقية */
.hero{padding-block:34px 18px}
.hero .wrap{grid-template-columns:1.1fr .9fr;gap:36px}
.hero .eyebrow{background:none;border:0;padding:0;font-size:14px;font-weight:400;color:var(--ink3);letter-spacing:0}
.hero .eyebrow a{color:var(--ink3);text-decoration:none}
.hero .eyebrow a:hover{color:var(--pri-t);text-decoration:underline}
.hero h1{font-size:clamp(30px,4.2vw,46px);margin-top:8px;letter-spacing:0;line-height:1.3}
.hero h1 .hl{background:none;color:var(--pri-t);padding:0}
.author{display:block;margin-top:12px;font-size:15px}
.author .by{color:var(--ink3);font-size:14.5px}
.author .name{font-family:var(--font-b);font-size:16px;font-weight:700;color:var(--ink);border:0}
.hero .lead{font-size:17px;color:var(--muted);margin-top:10px}
.hero-art img{display:block;width:100%;height:auto;max-height:340px;object-fit:cover;border-radius:18px}
:root[data-theme="dark"] .hero-art img{filter:brightness(.82) saturate(.92)}
.chips{gap:8px;margin-top:18px}
.chip{background:var(--paper);border:1px solid var(--line);font-weight:400;color:var(--muted);font-size:13.5px;padding:5px 12px}
.chip b{font-family:var(--font-b);font-weight:700;color:var(--ink);font-size:15px}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;gap:18px}.hero-art{order:-1}.hero-art img{max-height:200px}.hero{padding-block:16px 10px}}
/* الأقسام والعناوين */
.sec{padding-block:22px}
.sec-h h2{font-size:clamp(22px,2.6vw,28px)}
.sec-h .count{color:var(--acc-ink);font-family:var(--font-b);font-weight:700}
.sources{font-size:13.5px;color:var(--ink3)}
.sources a{color:var(--pri-t);font-weight:700}
/* الأزرار: إجراء رئيسي بنفسجي، والباقي بإطار */
.btn,.btn.warm,.btn.sun,.btn.teal{justify-content:center;background:var(--pri);color:var(--on-pri);border:1px solid var(--pri);border-radius:999px;font-weight:700;min-height:44px;padding:9px 18px}
.btn:hover{background:var(--pri-h);border-color:var(--pri-h);filter:none}
.btn.sm{min-height:36px;padding:6px 14px}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--pri-50);border-color:var(--pri-200)}
.btn svg [class^="f"],.btn svg [class*=" f"]{fill:transparent}
.btn svg .sk,.btn svg .sk2{stroke:currentColor}
.btn .ii{margin-inline-end:0}
/* الأزرار الصغيرة والبحث */
.pill{background:var(--paper);border:1px solid var(--line);color:var(--muted);font-weight:700;min-height:38px}
.pill:hover{color:var(--ink);border-color:var(--line2)}
.pill.on{background:var(--pri-50);border-color:var(--pri-200);color:var(--pri-t)}
.pill .n{opacity:1;font-size:12px;color:var(--ink3)}
.pill.on .n{color:var(--pri-t)}
select.pill{appearance:auto;padding-inline:12px}
.search{border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.search:focus-within{border-color:var(--pri-t)}
/* البطاقات: سطح أبيض بخط رفيع، بلا ظل ولا قفز */
.card,.panel,.idea,.riddle,.modal{box-shadow:none}
.card{border:1px solid var(--line);border-radius:16px;transition:border-color .15s}
.card:hover{transform:none;border-color:var(--pri-200)}
.card .art{aspect-ratio:auto;display:block;padding:16px 16px 0}
.card .body{padding:10px 16px 16px}
.ca{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ca-ic{display:grid;place-items:center;width:56px;height:56px;border-radius:14px;background:var(--pri-50)}
.ca-ic svg{width:40px;height:40px}
.ca-n{font-size:13px;font-weight:700;color:var(--ink3)}
.feature .go,.gcard .play{color:var(--pri-t);font-weight:700}
.gcard{background:var(--paper)}
.idea{border-radius:16px}
.idea .ic{background:var(--pri-50)!important;border-radius:14px}
.tag{background:var(--soft);color:var(--muted);font-weight:700}
.tag.k1,.tag.k2,.tag.k4,.tag.k5{background:var(--pri-50);color:var(--pri-t)}
.tag.k3{background:var(--acc-50);color:var(--acc-ink)}
.fav.on{color:var(--pri-t)}.fav.on svg path{fill:var(--pri-t)}
.heat span.f{background:var(--pri-t)}
.panel{border:1px solid var(--line);border-radius:18px}
.strip{background:var(--pri-50)!important;border:1px solid var(--pri-100);border-radius:20px}
.strip svg.sart{width:72px;height:72px}
.empty{border-radius:16px}
/* الأيقونات المرسومة: خطوط بنفسجية على تعبئة فاتحة */
.f1,.f2,.f3,.f4,.f5{fill:var(--pri-100)}
.fi{fill:var(--pri-t)}.fs{fill:var(--pri-50)}
.sk,.sk2{stroke:var(--pri-t);stroke-width:2.5}

.timer-face,.team .sc,.picked b,.streak,.gover .score,.big-word,.show-q,.show-a,.deck-card .big,.riddle .q,.stat{font-family:var(--font-b)}
.timer-face{font-weight:700;color:var(--ink)}
.timer-face.low{color:#B42318}

.team{background:var(--soft)}
.picked{background:var(--soft)}

.overlay{background:color-mix(in srgb,var(--ink) 40%,transparent)}
.modal{border-radius:20px}
.x{display:grid;place-items:center;color:var(--ink)}

function icon(name, c=4, size=64){

/* مولّد بذور ثابت */
function rng(seed){ let s = 0; for (const ch of String(seed)) s = (s*31 + ch.charCodeAt(0))>>>0; return ()=>{ s = (s*1664525 + 1013904223)>>>0; return s/4294967296; }; }
/* لوحة البطاقة: خلفية ملونة مع قصاصات مرسومة وأيقونة كبيرة */
function cardArt(name, c=4, seed="x", label=""){
  return `<span class="ca"><span class="ca-ic">${icon(name, c, 40)}</span>${label?`<span class="ca-n">${label}</span>`:""}</span>`;
}

const AD = n => String(n).replace(/[0-9]/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const rint = (a,b) => a + Math.floor(Math.random()*(b-a+1));
let AC = null;
function beep(f=520, d=.12){ try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=f; o.type="sine"; g.gain.setValueAtTime(.12,AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d); o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+d);}catch(e){} }

const GCATS = {"ذاكرة":4,"انتباه":1,"سرعة":2,"مرونة":5,"حل مشكلات":3};

/* api: el, setStat(text), timer(sec, onEnd), end(score, note), on(fn cleanup) */
const BRAIN_GAMES = [
{ id:"memory", name:"ذاكرة البطاقات", cat:"ذاكرة", icon:"cards", desc:"اقلب البطاقات واعثر على الأزواج المتطابقة بأقل عدد من المحاولات.", unit:"نقطة",
  play(api){
    const sets = ["🦁","🐬","🦒","🐝","🌵","🍉","🚀","⚽","🎨","📚","🌙","🧩"];
    const levels = [{p:6,cols:4},{p:8,cols:4},{p:10,cols:5}];
    api.el.innerHTML = `<div class="ginfo">اختر المستوى</div><div class="btnrow">${levels.map((l,i)=>`<button class="btn ${i?'ghost':''}" data-l="${i}">${["سهل","متوسط","صعب"][i]} · ${AD(l.p*2)} بطاقة</button>`).join("")}</div>`;
    api.el.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>start(levels[+b.dataset.l]));
    function start(L){
      const cards = shuffle(shuffle(sets).slice(0,L.p).flatMap(e=>[e,e]));
      let open=[], moves=0, found=0, lock=false; const t0=Date.now();
      api.el.innerHTML = `<div class="mem-grid" style="grid-template-columns:repeat(${L.cols},1fr)">${cards.map((e,i)=>`<button class="mem-c" data-i="${i}" aria-label="بطاقة"><span>${e}</span></button>`).join("")}</div>`;
      api.setStat(`المحاولات: ${AD(0)}`);
      api.el.querySelectorAll(".mem-c").forEach(b=>b.onclick=()=>{
        if (lock || b.classList.contains("open") || b.classList.contains("done")) return;
        b.classList.add("open"); open.push(b); beep(600,.05);
        if (open.length===2){
          moves++; api.setStat(`المحاولات: ${AD(moves)}`);
          const [a,c]=open;
          if (cards[a.dataset.i]===cards[c.dataset.i]){ a.classList.add("done"); c.classList.add("done"); open=[]; found++; beep(880,.1);
            if (found===L.p){ const secs=Math.round((Date.now()-t0)/1000); setTimeout(()=>api.end(Math.max(50, L.p*150 - moves*15 - secs*3), `${AD(moves)} محاولة في ${AD(secs)} ثانية`),500); }
          } else { lock=true; setTimeout(()=>{a.classList.remove("open");c.classList.remove("open");open=[];lock=false;},750); }
        }
      });
    }
  }},
{ id:"stroop", name:"تحدي الألوان", cat:"انتباه", icon:"eye", desc:"تظهر كلمة لون مكتوبة بحبر مختلف. اختر لون الحبر لا الكلمة! (مثل تأثير ستروب)", unit:"نقطة",

    function next(){

{ id:"math", name:"الحساب الخاطف", cat:"سرعة", icon:"calc", desc:"حل أكبر عدد من المسائل خلال 60 ثانية. تزداد الصعوبة كلما أجبت بشكل صحيح.", unit:"مسألة",
  play(api){
    let score=0, lvl=1, ans=0, typed="";
    api.timer(60, ()=>api.end(score, `وصلت إلى المستوى ${AD(lvl)}`));
    function gen(){
      const ops = lvl<3?["+","−"]:lvl<6?["+","−","×"]:["+","−","×","÷"];
      const op = ops[rint(0,ops.length-1)], m = 5+lvl*4; let a,b;
      if (op==="+"){a=rint(1,m);b=rint(1,m);ans=a+b;}
      else if(op==="−"){a=rint(2,m);b=rint(1,a);ans=a-b;}
      else if(op==="×"){a=rint(2,Math.min(12,2+lvl));b=rint(2,9);ans=a*b;}
      else {b=rint(2,9);ans=rint(2,10);a=ans*b;}
      typed=""; draw(`${a} ${op} ${b}`);
    }
    function draw(q){
      api.el.innerHTML = `<div class="math-q">${q} = ?</div><div class="math-in" id="mi">${typed||"&nbsp;"}</div><div class="pad">${[7,8,9,4,5,6,1,2,3].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button data-k="del">⌫</button><button data-k="0">0</button><button data-k="ok" style="background:var(--c3);color:var(--on-accent)">✓</button></div>`;
      api.el.querySelectorAll(".pad button").forEach(b=>b.onclick=()=>key(b.dataset.k));
      api.el.dataset.q=q;
    }
    function key(k){
      if (k==="del") typed=typed.slice(0,-1);
      else if (k==="ok"){ check(); return; }
      else if (typed.length<4) typed+=k;
      const mi=api.el.querySelector("#mi"); if(mi) mi.innerHTML=typed||"&nbsp;";
      if (typed.length>=String(ans).length && +typed===ans) check();
    }
    function check(){
      if (+typed===ans){ score++; if(score%3===0) lvl++; beep(820,.06); api.setStat(`الصحيحة: ${AD(score)} · المستوى ${AD(lvl)}`); gen(); }
      else { beep(200,.15); const mi=api.el.querySelector("#mi"); mi.classList.add("flash-bad"); setTimeout(()=>{typed="";mi.classList.remove("flash-bad");mi.innerHTML="&nbsp;";},350); }
    }
    const kh = e=>{ const d = "٠١٢٣٤٥٦٧٨٩".indexOf(e.key); if (/^[0-9]$/.test(e.key)) key(e.key); else if (d>=0) key(String(d)); else if (e.key==="Backspace") key("del"); else if (e.key==="Enter") key("ok"); };
    document.addEventListener("keydown", kh); api.on(()=>document.removeEventListener("keydown", kh));
    api.setStat(`الصحيحة: ${AD(0)}`); gen();
  }},
{ id:"simon", name:"تسلسل الأضواء", cat:"ذاكرة", icon:"brain", desc:"شاهد ترتيب الأضواء ثم أعده بالترتيب نفسه. يطول التسلسل في كل جولة.", unit:"جولة",

{ id:"schulte", name:"جدول شولت", cat:"انتباه", icon:"grid", desc:"اضغط الأرقام من ١ إلى ٢٥ بالترتيب بأسرع ما يمكن. تمرين كلاسيكي لتوسيع مجال الرؤية والتركيز.", unit:"ثانية", lower:true,

{ id:"reaction", name:"سرعة الاستجابة", cat:"سرعة", icon:"flash", desc:"انتظر حتى يتحول المربع إلى الأخضر ثم اضغط فوراً. خمس محاولات ونحسب المتوسط.", unit:"ملي ثانية", lower:true,

{ id:"odd", name:"اللون المختلف", cat:"انتباه", icon:"target", desc:"مربع واحد لونه مختلف قليلاً عن البقية. اعثر عليه، وتزداد الشبكة والصعوبة في كل مستوى.", unit:"مستوى",

      api.el.querySelectorAll("[data-n]").forEach(x=>x.onclick=()=>{ if(sel<0) return; const n=+x.dataset.n; cur[sel]=n; if(bad(sel)){errs++;beep(200,.12);} else beep(650,.04); api.setStat(`التعارضات: ${AD(errs)}`); draw();

/* ===== نماذج للطباعة ===== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lines = s => s.split("\n").map(x=>x.trim()).filter(Boolean);
const chunk = (a,n) => { const o=[]; for(let i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; };
const foot = (t) => `<div class="foot"><span>${esc(t)}</span><span>أفكار إبداعية لمتعة صفية · ${esc(getName())}</span></div>`;
const head2 = `<div class="sh-head"><span>الاسم:</span><span>الفصل:</span><span>التاريخ:</span></div>`;

function wordSearch(words, N){
  const grid=[...Array(N)].map(()=>Array(N).fill("")); const dirs=[[0,1],[1,0],[1,1],[-1,1]]; const placed=[];
  for (const w0 of words.slice().sort((a,b)=>b.length-a.length)){
    const w=[...w0.replace(/\s/g,"")]; if (w.length>N) continue; let ok=false;
    for (let t=0;t<300 && !ok;t++){
      const [dr,dc]=dirs[rint(0,dirs.length-1)]; const r0=rint(0,N-1), c0=rint(0,N-1);
      const rE=r0+dr*(w.length-1), cE=c0+dc*(w.length-1); if (rE<0||rE>=N||cE<0||cE>=N) continue;
      let fits=true; for(let i=0;i<w.length;i++){ const ch=grid[r0+dr*i][c0+dc*i]; if(ch && ch!==w[i]){fits=false;break;} }
      if (!fits) continue; for(let i=0;i<w.length;i++) grid[r0+dr*i][c0+dc*i]=w[i]; ok=true; placed.push(w0);
    }
  }
  for (const row of grid) for (let i=0;i<N;i++) if(!row[i]) row[i]=AR_LETTERS[rint(0,AR_LETTERS.length-1)];
  return {grid, placed};
}

function copy(text){
  const done=()=>toast("تم النسخ");
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(()=>fallback()); } else fallback();
  function fallback(){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); done(); }catch(e){ toast("حدد النص وانسخه يدوياً"); } ta.remove(); }
}

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-fav]"); if(!b) return;
  const id=b.dataset.fav; FAV.has(id)?FAV.delete(id):FAV.add(id); LS.set("fav",[...FAV]);
  b.classList.toggle("on", FAV.has(id)); b.setAttribute("aria-pressed", FAV.has(id));

});

function modal(title, cls=""){
  const o=document.createElement("div"); o.className="overlay";
  o.innerHTML=`<div class="modal ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h3>${esc(title)}</h3><span class="stat" id="mstat" hidden></span><button class="x" aria-label="إغلاق">×</button></div><div class="modal-b"></div></div>`;
  document.body.appendChild(o); document.body.style.overflow="hidden";
  const cleanups=[];
  const close=()=>{ cleanups.forEach(f=>{try{f()}catch(e){}}); o.remove(); document.body.style.overflow=""; document.removeEventListener("keydown",esc_); };
  const esc_=e=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown",esc_);
  o.addEventListener("click",e=>{ if(e.target===o) close(); });
  $(".x",o).onclick=close;
  return {o, body:$(".modal-b",o), stat:$("#mstat",o), close, on:f=>cleanups.push(f)};
}

/* ===== الألعاب الذهنية ===== */
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function dailyGames(){ const r=rng(todayKey()); const ids=BRAIN_GAMES.map(g=>g.id), out=[]; while(out.length<3){ const g=ids[Math.floor(r()*ids.length)]; if(!out.includes(g)) out.push(g); } return out; }
function playGame(g, onDone){
  const M=modal(g.name,"big"); M.stat.hidden=false; M.stat.textContent="";
  const best=LS.get("best_"+g.id,null);
  M.body.innerHTML=`<div class="gstage" id="gs"><div style="width:92px">${icon(g.icon,GCATS[g.cat],92)}</div><p class="ginfo">${g.desc}</p><span class="tag k${GCATS[g.cat]}">${g.cat}</span>${best!=null?`<span class="best">أفضل نتيجة: ${AD(best)} ${g.unit}</span>`:""}<button class="btn" id="gStart">ابدأ اللعب</button></div>`;
  let timers=[];
  const clearAll=()=>{ timers.forEach(clearInterval); timers=[]; };
  M.on(clearAll);
  function start(){
    clearAll(); const local=[]; M.on(()=>local.forEach(f=>f()));
    const el=$("#gs",M.body); el.innerHTML="";
    let ended=false;
    const api={ el,
      setStat:t=>{ M.stat.textContent=t; },
      on:f=>local.push(f),
      timer:(sec,onEnd)=>{ let left=sec; const bar=document.createElement("div"); bar.className="bar"; bar.style.width="min(420px,100%)"; bar.innerHTML=`<i style="width:100%;background:var(--c3);transition:width 1s linear"></i>`; el.before(bar); local.push(()=>bar.remove());
        const iv=setInterval(()=>{ left--; bar.firstChild.style.width=(left/sec*100)+"%"; if(left<=5) bar.firstChild.style.background="#B42318"; if(left<=0){ clearInterval(iv); onEnd(); } },1000); timers.push(iv); },
      end:(score,note)=>{ if(ended) return; ended=true; clearAll(); local.forEach(f=>{try{f()}catch(e){}}); local.length=0;
        const prev=LS.get("best_"+g.id,null); const better= prev==null || (g.lower? score<prev : score>prev); if(better) LS.set("best_"+g.id,score);
        const hist=LS.get("plays",{}); hist[g.id]=(hist[g.id]||0)+1; LS.set("plays",hist);
        const days=LS.get("days",[]); const tk=todayKey(); if(!days.includes(tk)){ days.push(tk); LS.set("days",days.slice(-400)); }
        const dd=LS.get("dailyDone",{}); if(dailyGames().includes(g.id)){ dd[tk]=[...new Set([...(dd[tk]||[]),g.id])]; LS.set("dailyDone",dd); }
        beep(better?990:660,.25);
        el.innerHTML=`<div class="gover float-in">${better?`<span class="tag k3">رقم قياسي جديد</span>`:""}<div class="score num">${AD(score)}</div><div>${g.unit}</div><p class="ginfo">${note||""}</p>${!better&&prev!=null?`<span class="best">أفضل نتيجة: ${AD(prev)} ${g.unit}</span>`:""}<div class="btnrow"><button class="btn" id="gAgain">العب مرة أخرى</button><button class="btn ghost" id="gClose">إغلاق</button></div></div>`;
        $("#gAgain",el).onclick=start; $("#gClose",el).onclick=M.close; if(onDone) onDone(); }
    };
    M.stat.textContent="";
    try{ g.play(api); }catch(e){ el.innerHTML=`<p class="ginfo">حدث خطأ في اللعبة. أغلق النافذة وحاول مجدداً.</p>`; console.error(e); }
  }
  $("#gStart",M.body).onclick=start;
}
function pageBrain(P){
  P.innerHTML = hero("brain","متعة صفية",`ألعاب ذهنية <span class="hl">تلعبها هنا</span>`,
    "ألعاب قصيرة لتمرين الذاكرة والانتباه والسرعة والمرونة وحل المشكلات، بروح تطبيقات التدريب الذهني اليومي. تلعبها مباشرة في الصفحة أو تعرضها على شاشة الفصل، وتُحفظ أفضل نتائجك على جهازك.",
    [[BRAIN_GAMES.length,"لعبة قابلة للعب"],[BRAIN_ACTS.length,"نشاط ذهني للفصل"],["∞","مستويات متجددة"]])
  + `<section class="sec"><div class="wrap"><div class="daily">
      <div class="panel"><h3>تمرين اليوم</h3><p class="sub">ثلاث ألعاب تتغير كل يوم. أكملها لتحافظ على سلسلة أيامك.</p><div class="daily-list" id="dList"></div></div>
      <div class="panel"><div style="display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap"><div><h3>ملفك الذهني</h3><p class="sub" style="margin:0">عدد مرات اللعب في كل مهارة</p></div><div style="text-align:center"><div class="streak num" id="streak">٠</div><span class="sub">يوماً متتالياً</span></div></div><div class="bars" id="bars" style="margin-top:14px"></div></div>
    </div></div></section>
  <section class="sec"><div class="wrap"><div class="sec-h"><div><h2>${BRAIN_GAMES.length} لعبة ذهنية</h2><p>اضغط على أي لعبة لتبدأ. تعمل بالفأرة واللمس، وبعضها بلوحة المفاتيح.</p></div></div>
    <div class="toolbar" id="bgCats"></div><div class="grid" id="bgGrid"></div></div></section>
  ${strip(3,"question","تحتاج ألغازاً للسبورة؟","مئة لغز عربي بأنواع مختلفة مع تلميح وإجابة، ووضع عرض كبير للشاشة.","riddles","افتح الألغاز")}
  <section class="sec"><div class="wrap"><div class="sec-h"><div><h2>${BRAIN_ACTS.length} نشاط ذهني للفصل</h2><p>أنشطة بلا شاشات تطبقها في دقائق: ذاكرة، انتباه، سرعة، مرونة، منطق، لغة، حساب.</p></div><button class="btn sun" id="bRnd">${icon("dice",1,20)} خمسة أنشطة عشوائية</button></div>
    <div class="toolbar">${searchBox("qAct","ابحث في الأنشطة...")}</div><div class="toolbar" id="bCats"></div><div id="bPick"></div><div class="grid wide" id="bGrid"></div></div></section>`;
  function drawDaily(){
    const ids=dailyGames(), done=(LS.get("dailyDone",{})[todayKey()]||[]);
    $("#dList").innerHTML=ids.map(id=>{ const g=BRAIN_GAMES.find(x=>x.id===id); const ok=done.includes(id); return `<button class="dl-item ${ok?'done':''}" data-g="${id}"><span class="ck">${ok?"✓":""}</span><div style="width:40px">${icon(g.icon,GCATS[g.cat],40)}</div><div style="flex:1;min-width:0"><b>${g.name}</b><span>${g.cat}</span></div><span class="tag">${ok?"تم":"العب"}</span></button>`; }).join("")+(done.length>=3?`<p class="sub" style="margin:6px 0 0;text-align:center">أحسنت! أكملت تمرين اليوم</p>`:"");
    $$("#dList [data-g]").forEach(b=>b.onclick=()=>playGame(BRAIN_GAMES.find(x=>x.id===b.dataset.g),()=>{drawDaily();drawProfile();drawGames();}));
  }
  function drawProfile(){
    const days=new Set(LS.get("days",[])); let s=0; const d=new Date(); for(;;){ const k=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; if(days.has(k)){s++; d.setDate(d.getDate()-1);} else break; }
    $("#streak").textContent=AD(s);
    const plays=LS.get("plays",{}); const per={}; Object.keys(GCATS).forEach(c=>per[c]=0); BRAIN_GAMES.forEach(g=>per[g.cat]+=plays[g.id]||0);
    const mx=Math.max(1,...Object.values(per));
    $("#bars").innerHTML=Object.keys(GCATS).map(c=>`<div class="bar-row"><span>${c}</span><div class="bar"><i style="width:${per[c]/mx*100}%;background:var(--c${GCATS[c]})"></i></div><span class="num">${AD(per[c])}</span></div>`).join("");
  }
  let gcat="";
  function drawGames(){
    $("#bgCats").innerHTML=pills([["","الكل"],...Object.keys(GCATS).map(c=>[c,c])],gcat,"gc",countBy(BRAIN_GAMES,"cat"));
    $$("#bgCats [data-gc]").forEach(b=>b.onclick=()=>{gcat=b.dataset.gc;drawGames();});
    $("#bgGrid").innerHTML=BRAIN_GAMES.filter(g=>!gcat||g.cat===gcat).map(g=>{ const b=LS.get("best_"+g.id,null), c=GCATS[g.cat]; return `<button class="card gcard" data-g="${g.id}"><div class="art">${cardArt(g.icon,c,g.id)}</div><div class="body"><h3>${g.name}</h3><p class="desc">${g.desc}</p><div class="meta"><span class="tag k${c}">${g.cat}</span><span class="best">${b!=null?`أفضل: ${AD(b)} ${g.unit}`:"لم تلعبها بعد"}</span><span class="play" style="margin-inline-start:auto">العب ←</span></div></div></button>`; }).join("");
    $$("#bgGrid [data-g]").forEach(b=>b.onclick=()=>playGame(BRAIN_GAMES.find(x=>x.id===b.dataset.g),()=>{drawDaily();drawProfile();drawGames();}));
  }
  let cat="", q="";
  function drawActs(){
    $("#bCats").innerHTML=pills([["","الكل"],...Object.keys(BRAIN_CATS).map(c=>[c,c])],cat,"bc",countBy(BRAIN_ACTS,"cat"));
    $$("#bCats [data-bc]").forEach(b=>b.onclick=()=>{cat=b.dataset.bc;drawActs();});
    const L=BRAIN_ACTS.filter(x=>(!cat||x.cat===cat)&&(!q||(x.title+x.desc).includes(q)));
    $("#bGrid").innerHTML=L.length?L.map(x=>actCard(x)).join(""):`<div class="empty">لا توجد نتائج.</div>`;
  }
  const actCard=x=>{ const m=BRAIN_CATS[x.cat]; return `<article class="idea"><div class="ic" style="background:var(--t${m.c})">${icon(m.icon,m.c,30)}</div><div class="tx"><div class="row"><span class="idx">#${BRAIN_ACTS.indexOf(x)+1}</span><span class="tag k${m.c}">${x.cat}</span>${favBtn(x.id)}</div><h3>${x.title}</h3><p>${x.desc}</p></div></article>`; };
  $("#qAct").oninput=e=>{q=e.target.value.trim();drawActs();};
  $("#bRnd").onclick=()=>{ $("#bPick").innerHTML=`<div class="panel float-in" style="margin-bottom:14px"><h3>برنامج ذهني من ٥ أنشطة (١٠ دقائق تقريباً)</h3><div class="grid wide" style="margin-top:10px">${shuffle(BRAIN_ACTS).slice(0,5).map(actCard).join("")}</div></div>`; };
  drawDaily(); drawProfile(); drawGames(); drawActs();
}

/* ===== الألغاز ===== */
function pageRiddles(P){
  P.innerHTML = hero("riddles","متعة صفية",`ألغاز ذهنية <span class="hl">بالعربية</span>`,
    "مئة لغز مكتوبة بالعربية: ألغاز كلمات، ومنطق، وأرقام، وألغاز بصرية بالرموز، وتفكير جانبي. لكل لغز تلميح وإجابة، ومستوى صعوبة، ووضع عرض كبير لشاشة الفصل.",
    [[RIDDLES.length,"لغز"],[Object.keys(RIDDLE_TYPES).length,"أنواع"],["٣","مستويات"]])
  + `<section class="sec"><div class="wrap"><div class="sources">مصدر الإلهام: <a href="https://www.instagram.com/oddlinearchive/" target="_blank" rel="noopener">@oddlinearchive</a> — بصياغة عربية جديدة</div></div></section>
  <section class="sec"><div class="wrap"><div class="sec-h"><div><h2>بنك الألغاز</h2><p id="rProg"></p></div><div class="btnrow"><button class="btn" id="rShow">${icon("eye",2,20)} وضع العرض</button><a class="btn ghost" href="#print">${PRINTER}بطاقات للطباعة</a></div></div>
    <div class="toolbar">${searchBox("qR","ابحث في الألغاز...")}<select class="pill" id="rLvl" aria-label="المستوى"><option value="0">كل المستويات</option><option value="1">★ سهل</option><option value="2">★★ متوسط</option><option value="3">★★★ صعب</option></select><button class="pill" id="rUnsolved">غير المحلولة فقط</button></div>
    <div class="toolbar" id="rTypes"></div>
    <div class="grid" id="rGrid"></div></div></section>`;
  let type="", q="", lvl=0, unsolved=false; let solved=new Set(LS.get("solved",[]));
  function prog(){ $("#rProg").textContent=`حللت ${AD(solved.size)} من ${AD(RIDDLES.length)} لغزاً. اضغط «حللته» بعد كل لغز لتتابع تقدمك.`; }
  function list(){ return RIDDLES.filter(r=>(!type||r.type===type)&&(!lvl||r.lvl===lvl)&&(!unsolved||!solved.has(r.id))&&(!q||(r.q+r.a).includes(q))); }
  function draw(){
    $("#rTypes").innerHTML=pills([["","الكل"],...Object.keys(RIDDLE_TYPES).map(t=>[t,t])],type,"rt",countBy(RIDDLES,"type"));
    $$("#rTypes [data-rt]").forEach(b=>b.onclick=()=>{type=b.dataset.rt;draw();});
    const L=list();
    $("#rGrid").innerHTML=L.length?L.map(r=>{ const m=RIDDLE_TYPES[r.type], n=RIDDLES.indexOf(r)+1, ok=solved.has(r.id); return `<article class="riddle" data-r="${r.id}"><span class="no num">${AD(n)}</span><div class="top-row"><span class="tag k${m.c}">${r.type}</span><span class="tag">${"★".repeat(r.lvl)}</span>${ok?`<span class="tag k3">✓ محلول</span>`:""}</div><div class="q ${/[\u{1F300}-\u{1FAFF}]/u.test(r.q)?'emoji':''}">${r.q}</div><div class="hint" hidden><b>تلميح:</b> ${r.hint}</div><div class="ans" hidden><b>الإجابة:</b> ${r.a}</div><div class="acts"><button class="btn ghost sm" data-h>تلميح</button><button class="btn sm" data-a>الإجابة</button><button class="btn ghost sm" data-s>${ok?"إلغاء":"حللته ✓"}</button>${favBtn(r.id)}</div></article>`; }).join(""):`<div class="empty">لا توجد ألغاز بهذه الشروط.</div>`;
    $$("#rGrid .riddle").forEach(c=>{ $("[data-h]",c).onclick=()=>$(".hint",c).hidden=!$(".hint",c).hidden; $("[data-a]",c).onclick=()=>$(".ans",c).hidden=!$(".ans",c).hidden;
      $("[data-s]",c).onclick=()=>{ const id=c.dataset.r; solved.has(id)?solved.delete(id):solved.add(id); LS.set("solved",[...solved]); prog(); draw(); }; });
    prog();
  }
  $("#qR").oninput=e=>{q=e.target.value.trim();draw();};
  $("#rLvl").onchange=e=>{lvl=+e.target.value;draw();};
  $("#rUnsolved").onclick=e=>{unsolved=!unsolved;e.currentTarget.classList.toggle("on",unsolved);draw();};
  $("#rShow").onclick=()=>{
    const L=shuffle(list()); if(!L.length) return; let i=0, sec=0, iv=null; const M=modal("وضع العرض","big"); M.stat.hidden=false;
    const drawS=()=>{ const r=L[i], m=RIDDLE_TYPES[r.type]; clearInterval(iv); sec=0; M.stat.textContent=`${AD(i+1)} / ${AD(L.length)}`;
      M.body.innerHTML=`<div style="text-align:center"><span class="tag k${m.c}">${r.type} · ${"★".repeat(r.lvl)}</span></div><div class="show-q">${r.q}</div><div class="timer-face num" id="sT" style="font-size:34px;color:var(--muted)">٠</div><div class="hint" id="sH" hidden style="text-align:center;font-size:18px"><b>تلميح:</b> ${r.hint}</div><div class="show-a" id="sA" hidden>${r.a}</div><div class="btnrow" style="margin-top:16px"><button class="btn ghost" id="sPrev">→ السابق</button><button class="btn ghost" id="sHint">تلميح</button><button class="btn sun" id="sAns">اكشف الإجابة</button><button class="btn" id="sNext">التالي ←</button></div>`;
      iv=setInterval(()=>{ sec++; const t=$("#sT",M.body); if(t) t.textContent=AD(sec)+" ث"; },1000);
      $("#sHint",M.body).onclick=()=>$("#sH",M.body).hidden=false; $("#sAns",M.body).onclick=()=>{ $("#sA",M.body).hidden=false; clearInterval(iv); beep(880,.15); };
      $("#sNext",M.body).onclick=()=>{ i=(i+1)%L.length; drawS(); }; $("#sPrev",M.body).onclick=()=>{ i=(i-1+L.length)%L.length; drawS(); }; };
    M.on(()=>clearInterval(iv)); drawS();
  };
  draw();
}









/* ===== الطباعة ===== */
function pagePrint(P){
  P.innerHTML = hero("print","متعة صفية",`نماذج <span class="hl">للطباعة</span>`,
    "مولّدات لأوراق الألعاب الصفية: عدّل الكلمات والعبارات، واضغط «إنشاء» لتحصل على نسخ مختلفة، ثم اطبعها على ورق A4.",
    [[PRINTABLES.length,"نموذج"],["A4","مقاس الورق"],["∞","نسخ عشوائية"]])
  + `<section class="sec"><div class="wrap">${IN_FRAME?`<div class="pr-note">الطباعة المباشرة لا تعمل داخل هذه المعاينة. افتح ملف <b>index.html</b> من مجلد الموقع في المتصفح ثم اضغط «اطبع»، أو استخدم أمر الطباعة في متصفحك من تلك النسخة.</div>`:""}
    <div class="pr-layout"><div><div class="pr-list" id="prList"></div></div>
    <div style="min-width:0"><div class="panel" style="margin-bottom:14px"><h3 id="prName"></h3><div id="prForm" class="fields"></div><div class="btnrow" style="justify-content:flex-start;margin-top:14px"><button class="btn" id="prMake">إنشاء / تحديث</button><button class="btn teal" id="prPrint">${PRINTER}اطبع</button><span class="sub" id="prPages" style="margin:0;align-self:center"></span></div></div>
    <div class="sheets" id="prOut"></div></div></div></div></section>`;
  let cur=PRINTABLES[0];
  function list(){ $("#prList").innerHTML=PRINTABLES.map(p=>`<button class="pr-item ${p===cur?'on':''}" data-pr="${p.id}"><span class="ic" style="background:var(--t${p.c})">${icon(p.icon,p.c,26)}</span><span><b>${p.name}</b><span>${p.hint}</span></span></button>`).join("");
    $$("[data-pr]").forEach(b=>b.onclick=()=>{ cur=PRINTABLES.find(x=>x.id===b.dataset.pr); open(); if(innerWidth<980) $("#prName").scrollIntoView({behavior:"smooth"}); }); }
  function open(){ list(); $("#prName").textContent=cur.name; $("#prForm").innerHTML=cur.form; make(); }
  function make(){ $("#prOut").innerHTML=cur.render(); fit(); const n=$$("#prOut .sheet").length; $("#prPages").textContent=`${AD(n)} ${n>2?"صفحات":"صفحة"}`; }
  function fit(){ const W=$("#prOut").clientWidth; $$("#prOut .sheet").forEach(s=>{ const k=Math.min(1,(W-4)/794); s.style.zoom=k<1?k:""; }); }
  $("#prMake").onclick=make;
  $("#prPrint").onclick=()=>{ if(IN_FRAME){ toast("افتح index.html في المتصفح للطباعة"); return; }
    let root=$("#print-root"); if(!root){ root=document.createElement("div"); root.id="print-root"; document.body.appendChild(root); }
    root.innerHTML=$("#prOut").innerHTML; $$(".sheet",root).forEach(s=>s.style.zoom="");
    document.documentElement.classList.add("print-mode"); setTimeout(()=>{ const t0=document.title; document.title=cur.name; window.print(); setTimeout(()=>{ document.documentElement.classList.remove("print-mode"); root.innerHTML=""; document.title=t0; },400); },60); };
  addEventListener("resize",fit); ROUTE_CLEANUP.push(()=>removeEventListener("resize",fit));
  open();
}

/* ===== التوجيه ===== */
let ROUTE_CLEANUP=[];
const ROUTES={home:pageHome,games:pageGames,brain:pageBrain,riddles:pageRiddles,print:pagePrint};
function route(){
  $$(".overlay .x").forEach(b=>{try{b.click()}catch(e){}});
  ROUTE_CLEANUP.forEach(f=>{try{f()}catch(e){}}); ROUTE_CLEANUP=[];
  const id=(location.hash||"#home").slice(1); const fn=ROUTES[id]||pageHome; const P=$("#page");
  fn(P); bindName();
  $$(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.p===(ROUTES[id]?id:"home")));
  const on=$(".nav a.on"); if(on) on.scrollIntoView({inline:"center",block:"nearest"});
  const T={home:"أفكار إبداعية لمتعة صفية",games:"ألعاب جماعية",brain:"ألعاب ذهنية",riddles:"ألغاز ذهنية",print:"نماذج للطباعة"};
  document.title = (ROUTES[id]&&id!=="home"? T[id]+" · ":"") + "متعة صفية · دليل المعلم الألمعي";
  scrollTo({top:0});
}
shell(); addEventListener("hashchange",route); route();
